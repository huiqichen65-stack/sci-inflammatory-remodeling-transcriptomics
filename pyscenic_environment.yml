name: pyscenic_env

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - numpy=1.23.5
  - pandas=1.5.3
  - scipy=1.10.1
  - scikit-learn=1.2.2
  - numba=0.57.1
  - llvmlite=0.40.1
  - dask=2023.5.0
  - distributed=2023.5.0
  - pyarrow=12.0.1
  - networkx=2.8.8
  - loompy=3.0.7
  - ctxcore=0.2.0
  - arboreto=0.1.6
  - umap-learn=0.5.5
  - pynndescent=0.5.10
  - pyscenic=0.12.1
  - cytoolz
  - attrs
  - numexpr
  - cloudpickle
  - pyyaml
  - tqdm
  - fsspec
  - requests
  - aiohttp
  - pip
  - pip:
      - multiprocessing_on_dill
      - frozendict
      - boltons
      - interlap
